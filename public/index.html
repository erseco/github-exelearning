<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>eXeLearning · GitHub</title>
<meta name="description" content="Edit eXeLearning resources stored on GitHub and save them back to the repository.">
<link rel="icon" href="/editor/favicon.ico">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<svg hidden><symbol id="github-mark" viewBox="0 0 16 16"><path fill="currentColor" d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"/></symbol></svg>
<header id="bar" hidden>
  <a class="brand" href="/"><img src="/editor/exelearning.png" alt="" width="20" height="20">eXeLearning</a>
  <a id="repo-link" target="_blank" rel="noopener"></a>
  <span id="status" role="status"></span>
  <span class="spacer"></span>
  <button id="save" class="primary" type="button" disabled>
    <svg width="16" height="16" aria-hidden="true"><use href="#github-mark"/></svg>
    <span id="save-label"></span>
  </button>
  <details class="menu">
    <summary aria-label="Menu">⋯</summary>
    <div>
      <button id="download" type="button"></button>
      <button id="badge" type="button"></button>
      <button id="pages" type="button"></button>
      <button id="other" type="button"></button>
      <button id="logout" type="button"></button>
    </div>
  </details>
</header>

<main id="landing">
  <h1><img src="/editor/exelearning.png" alt="" width="40" height="40"> eXeLearning · GitHub</h1>
  <p id="tagline"></p>
  <p id="message" role="alert"></p>
  <ul id="candidates"></ul>
  <section id="signin-card" class="signin-card" hidden>
    <h2 id="see-all"></h2>
    <p class="muted" id="see-all-hint"></p>
    <p><button type="button" id="signin" class="github"><svg width="18" height="18" aria-hidden="true"><use href="#github-mark"/></svg><span id="signin-label"></span></button></p>
  </section>
  <div class="divider" id="divider" hidden><span id="or-open"></span></div>
  <form id="open-form">
    <label for="repo-input" id="repo-label"></label>
    <div class="row">
      <input id="repo-input" name="repo" placeholder="owner/repository" required autocomplete="off" spellcheck="false">
      <button class="primary" id="open-button"></button>
    </div>
    <p class="muted hint" id="open-hint"></p>
  </form>
  <section id="mine">
    <div id="repos-box" hidden>
      <div class="resources-head">
        <div>
          <h2 id="repos-title"></h2>
          <p class="muted" id="repos-summary"></p>
        </div>
        <div class="view-toggle" role="group" id="view-toggle">
          <button type="button" id="view-grid" aria-pressed="true"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="2" y="2" width="5" height="5" rx="1"/><rect x="9" y="2" width="5" height="5" rx="1"/><rect x="2" y="9" width="5" height="5" rx="1"/><rect x="9" y="9" width="5" height="5" rx="1"/></svg><span id="view-grid-label"></span></button>
          <button type="button" id="view-list" aria-pressed="false"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M2 4h12M2 8h12M2 12h12"/></svg><span id="view-list-label"></span></button>
        </div>
      </div>
      <ul id="repos" class="grid"></ul>
      <details id="other-repos" hidden>
        <summary id="other-summary"></summary>
        <ul id="other-list"></ul>
      </details>
      <p class="links"><button type="button" class="link" id="more-access"></button> · <button type="button" class="link" id="logout-landing"></button></p>
    </div>
  </section>
  <footer id="footer">
    <span id="experimental"></span> ·
    <a href="https://github.com/erseco/github-exelearning" target="_blank" rel="noopener"><svg width="12" height="12" aria-hidden="true"><use href="#github-mark"/></svg><span id="source-label"></span></a>
  </footer>
</main>

<div id="editor" hidden></div>

<dialog id="save-dialog">
  <form method="dialog">
    <label><span id="message-label"></span><input id="commit-message" required></label>
    <p id="files-label"></p>
    <ul id="save-files"></ul>
    <label class="check" id="delete-row"><input type="checkbox" id="delete-removed"><span id="delete-label"></span></label>
    <fieldset>
      <label class="check"><input type="radio" name="target" value="branch" id="to-branch" checked><span id="branch-label"></span></label>
      <label class="check"><input type="radio" name="target" value="pr" id="to-pr"><span id="pr-label"></span></label>
    </fieldset>
    <menu>
      <button value="cancel" id="cancel-save" formnovalidate></button>
      <button value="save" id="confirm-save" class="primary"></button>
    </menu>
  </form>
</dialog>

<dialog id="pages-dialog">
  <h2 id="pages-title"></h2>
  <p id="pages-intro"></p>
  <ol>
    <li><a id="pages-workflow" target="_blank" rel="noopener"></a></li>
    <li><a id="pages-settings" target="_blank" rel="noopener"></a></li>
  </ol>
  <p id="pages-result"></p>
  <menu><button type="button" id="pages-close" class="primary"></button></menu>
</dialog>

<dialog id="saving-dialog"><p class="busy" id="saving-text"></p></dialog>

<div id="toast" role="status" hidden></div>
<script src="/app.js"></script>
</body>
</html>
